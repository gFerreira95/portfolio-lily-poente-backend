spring.application.name=studio-api
server.port=${PORT:8080}

# Importa o .env na raiz do projeto (ou variável de ambiente no deploy)
spring.config.import=optional:file:.env[.properties],optional:file:./.env[.properties]

# Compatível com Spring Boot 4.x (novo padrão)
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=lilypoentedb

# Compatível com Spring Boot 3.x (caso faça downgrade no pom.xml)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=lilypoentedb

cors.allowed.origins=${CORS_ORIGINS:http://localhost:4200}

# Configurações de Segurança e Admin
api.security.token.secret=${JWT_SECRET:chave-padrao-apenas-para-dev}
admin.default.username=${ADMIN_USERNAME:admin}
admin.default.password=${ADMIN_PASSWORD:123456}